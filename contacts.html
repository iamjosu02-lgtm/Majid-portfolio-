<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacts | Majid Mohamed</title>

    <!-- GOOGLE FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


    <!-- FONT AWESOME ICONS -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <style>

        :root{

            --orange:#ff6b00;

            --skyblue:#00bfff;

            --dark:#0f172a;

            --white:#ffffff;
        }


        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

            font-family:'Poppins', sans-serif;
        }


        body{

            background:black;

            color:white;

            overflow-x:hidden;

            overflow-y:auto;
        }


        /* VIDEO BACKGROUND */

        .video-container{

            position:fixed;

            top:0;
            left:0;

            width:100%;

            height:100%;

            overflow:hidden;

            z-index:-5;
        }


        video{

            width:100%;

            height:100%;

            object-fit:cover;
        }


        /* OVERLAY */

        .overlay{

            position:fixed;

            top:0;
            left:0;

            width:100%;

            height:100%;

            background:
            linear-gradient(
                135deg,
                rgba(255,107,0,0.28),
                rgba(0,191,255,0.22),
                rgba(15,23,42,0.55)
            );

            z-index:-4;
        }


        /* GLOW EFFECTS */

        .orange-glow{

            position:fixed;

            width:700px;

            height:700px;

            background:
            radial-gradient(
                circle,
                rgba(255,107,0,0.45),
                transparent 70%
            );

            top:-200px;

            left:-150px;

            filter:blur(80px);

            z-index:-3;
        }


        .blue-glow{

            position:fixed;

            width:700px;

            height:700px;

            background:
            radial-gradient(
                circle,
                rgba(0,191,255,0.40),
                transparent 70%
            );

            bottom:-220px;

            right:-150px;

            filter:blur(80px);

            z-index:-3;
        }


        /* NAVBAR */

        nav{

            position:fixed;

            top:0;

            width:100%;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:22px 7%;

            z-index:1000;

            backdrop-filter:blur(12px);

            background:rgba(255,255,255,0.05);

            border-bottom:
            1px solid rgba(255,255,255,0.12);
        }


        .logo{

            font-size:50px;

            font-weight:800;

            color:white;

            text-shadow:
            0 0 20px rgba(255,255,255,0.4);
        }


        /* BUTTON */

        .back-btn{

            padding:14px 28px;

            border:none;

            border-radius:50px;

            background:white;

            color:var(--orange);

            font-size:15px;

            font-weight:600;

            cursor:pointer;

            transition:0.45s ease;

            box-shadow:
            0 8px 25px rgba(0,0,0,0.25);
        }


        .back-btn:hover{

            background:var(--skyblue);

            color:white;

            transform:
            rotate(-5deg)
            scale(1.08);

            box-shadow:
            0 0 25px rgba(0,191,255,0.7);
        }


        /* MAIN SECTION */

        .contact-section{

            width:100%;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:140px 20px 60px;
        }


        /* GLASS CONTAINER */

        .contact-container{

            width:100%;

            max-width:1150px;

            background:
            rgba(255,255,255,0.08);

            border:
            1px solid rgba(255,255,255,0.18);

            backdrop-filter:blur(22px);

            border-radius:35px;

            padding:60px;

            box-shadow:
            0 15px 45px rgba(0,0,0,0.45);

            animation:
            floatBox 4s ease-in-out infinite;
        }


        /* FLOAT EFFECT */

        @keyframes floatBox{

            0%{

                transform:translateY(0px);
            }

            50%{

                transform:translateY(-10px);
            }

            100%{

                transform:translateY(0px);
            }
        }


        /* TITLE */

        .contact-title{

            text-align:center;

            font-size:70px;

            margin-bottom:50px;

            text-shadow:
            0 8px 25px rgba(0,0,0,0.45);
        }


        /* CONTACT GRID */

        .contact-grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(280px,1fr));

            gap:30px;
        }


        /* CONTACT CARD */

        .contact-card{

            background:
            rgba(255,255,255,0.10);

            border:
            1px solid rgba(255,255,255,0.14);

            border-radius:25px;

            padding:35px;

            text-align:center;

            transition:0.45s ease;

            animation:
            slideUp 1.5s ease;
        }


        .contact-card:hover{

            transform:
            translateY(-10px)
            scale(1.03);

            background:
            rgba(255,255,255,0.16);

            box-shadow:
            0 0 30px rgba(0,191,255,0.35);
        }


        @keyframes slideUp{

            from{

                opacity:0;

                transform:translateY(100px);
            }

            to{

                opacity:1;

                transform:translateY(0);
            }
        }


        /* ICONS */

        .icon{

            font-size:55px;

            margin-bottom:20px;

            color:white;

            transition:0.4s ease;
        }


        .contact-card:hover .icon{

            transform:
            rotate(10deg)
            scale(1.18);

            color:#00bfff;

            text-shadow:
            0 0 25px rgba(0,191,255,0.9);
        }


        .contact-card h2{

            font-size:28px;

            margin-bottom:18px;
        }


        .contact-card p{

            font-size:18px;

            line-height:1.8;

            color:rgba(255,255,255,0.95);

            word-break:break-word;
        }


        /* RESPONSIVE */

        @media(max-width:900px){

            .contact-title{

                font-size:48px;
            }

            .contact-container{

                padding:35px;
            }

        }


        @media(max-width:600px){

            .contact-title{

                font-size:34px;
            }

            .contact-card{

                padding:25px;
            }

            .contact-card h2{

                font-size:22px;
            }

            .contact-card p{

                font-size:16px;
            }

            .back-btn{

                padding:12px 18px;

                font-size:13px;
            }

        }

    </style>

</head>

<body>
