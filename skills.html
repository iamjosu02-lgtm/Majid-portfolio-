<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills | Majid Mohamed</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        :root{

            --orange:#ff6b00;

            --purple:#8b5cf6;

            --white:#ffffff;
        }


        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

            font-family:'Poppins', sans-serif;
        }


        body{

            background:black;

            color:white;

            overflow:hidden;
        }


        /* VIDEO BACKGROUND */

        .video-container{

            position:fixed;

            top:0;
            left:0;

            width:100%;

            height:100%;

            overflow:hidden;

            z-index:-5;
        }


        video{

            width:100%;

            height:100%;

            object-fit:cover;
        }


        /* OVERLAY */

        .overlay{

            position:fixed;

            top:0;
            left:0;

            width:100%;

            height:100%;

            background:
            linear-gradient(
                135deg,
                rgba(255,107,0,0.35),
                rgba(139,92,246,0.32),
                rgba(0,0,0,0.55)
            );

            z-index:-4;
        }


        /* ORANGE GLOW */

        .orange-glow{

            position:fixed;

            width:650px;

            height:650px;

            background:
            radial-gradient(
                circle,
                rgba(255,107,0,0.45),
                transparent 70%
            );

            top:-180px;

            left:-150px;

            filter:blur(70px);

            z-index:-3;
        }


        /* PURPLE GLOW */

        .purple-glow{

            position:fixed;

            width:700px;

            height:700px;

            background:
            radial-gradient(
                circle,
                rgba(139,92,246,0.45),
                transparent 70%
            );

            bottom:-220px;

            right:-150px;

            filter:blur(80px);

            z-index:-3;
        }


        /* NAVBAR */

        nav{

            position:fixed;

            top:0;

            width:100%;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:22px 7%;

            z-index:1000;

            backdrop-filter:blur(12px);

            background:rgba(255,255,255,0.05);

            border-bottom:
            1px solid rgba(255,255,255,0.12);
        }


        .logo{

            font-size:50px;

            font-weight:800;

            color:white;

            text-shadow:
            0 0 20px rgba(255,255,255,0.4);
        }


        /* BUTTON */

        .back-btn{

            padding:14px 28px;

            border:none;

            border-radius:50px;

            background:white;

            color:var(--orange);

            font-size:15px;

            font-weight:600;

            cursor:pointer;

            transition:0.45s ease;

            box-shadow:
            0 8px 25px rgba(0,0,0,0.25);
        }


        .back-btn:hover{

            background:var(--purple);

            color:white;

            transform:
            rotate(-5deg)
            scale(1.08);

            box-shadow:
            0 0 25px rgba(139,92,246,0.7);
        }


        /* MAIN SECTION */

        .skills-section{

            width:100%;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:
            140px 20px 40px;
        }


        /* GLASS CONTAINER */

        .skills-container{

            width:100%;

            max-width:1200px;

            background:
            rgba(255,255,255,0.08);

            border:
            1px solid rgba(255,255,255,0.18);

            backdrop-filter:blur(20px);

            border-radius:35px;

            padding:55px;

            box-shadow:
            0 15px 45px rgba(0,0,0,0.45);

            animation:
            floatBox 4s ease-in-out infinite,
            fadeUp 1.5s ease;
        }


        /* TITLE */

        .skills-title{

            text-align:center;

            font-size:68px;

            margin-bottom:55px;

            text-shadow:
            0 8px 25px rgba(0,0,0,0.45);
        }


        /* SKILLS GRID */

        .skills-grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(240px,1fr));

            gap:30px;
        }


        /* SKILL CARD */

        .skill-card{

            height:220px;

            display:flex;

            justify-content:center;

            align-items:center;

            text-align:center;

            padding:20px;

            border-radius:28px;

            background:
            rgba(255,255,255,0.10);

            border:
            1px solid rgba(255,255,255,0.15);

            box-shadow:
            0 10px 25px rgba(0,0,0,0.25);

            font-size:24px;

            font-weight:700;

            transition:0.5s ease;

            animation:
            rotateCard 7s linear infinite;
        }


        .skill-card:hover{

            transform:
            scale(1.08);

            background:
            rgba(255,255,255,0.16);

            box-shadow:
            0 0 30px rgba(139,92,246,0.4);
        }


        /* ROTATION */

        @keyframes rotateCard{

            0%{

                transform:rotateY(0deg);
            }

            100%{

                transform:rotateY(360deg);
            }
        }


        /* FLOATING */

        @keyframes floatBox{

            0%{

                transform:translateY(0px);
            }

            50%{

                transform:translateY(-12px);
            }

            100%{

                transform:translateY(0px);
            }
        }


        /* FADE */

        @keyframes fadeUp{

            from{

                opacity:0;

                transform:translateY(80px);
            }

            to{

                opacity:1;

                transform:translateY(0);
            }
        }


        /* RESPONSIVE */

        @media(max-width:900px){

            .skills-title{

                font-size:48px;
            }

            .skills-container{

                padding:35px;
            }

            .skill-card{

                font-size:20px;
            }

        }


        @media(max-width:600px){

            body{

                overflow:auto;
            }

            .skills-title{

                font-size:36px;
            }

            .skill-card{

                height:180px;

                font-size:18px;
            }

            .back-btn{

                padding:12px 18px;

                font-size:13px;
            }

        }

    </style>

</head>

<body>



    <!-- VIDEO BACKGROUND -->

    <div class="video-container">

        <video autoplay muted loop playsinline>

            <source src="wall5.mp4" type="video/mp4">

        </video>

    </div>



    <!-- OVERLAYS -->

    <div class="overlay"></div>

    <div class="orange-glow"></div>

    <div class="purple-glow"></div>



    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            M

        </div>


        <a href="index.html">

            <button class="back-btn">

                Back Home

            </button>

        </a>

    </nav>



    <!-- MAIN SECTION -->

    <section class="skills-section">

        <div class="skills-container">


            <h1 class="skills-title">

                Skills

            </h1>



            <!-- SKILLS GRID -->

            <div class="skills-grid">


                <div class="skill-card">

                    Data Analytics

                </div>



                <div class="skill-card">

                    Machine Learning

                </div>



                <div class="skill-card">

                    Deep Learning

                </div>



                <div class="skill-card">

                    APIs Integration

                </div>



                <div class="skill-card">

                    Data Visualization

                </div>



                <div class="skill-card">

                    Python Programming

                </div>



                <div class="skill-card">

                    SQL & Databases

                </div>



                <div class="skill-card">

                    Artificial Intelligence

                </div>


            </div>

        </div>

    </section>

</body>

</html>
