<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Majid Mohamed | Portfolio</title>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


    <style>

        :root{

            --orange:#ff6b00;

            --skyblue:#00bfff;

            --dark:#0f172a;

            --white:#ffffff;
        }


        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

            font-family:'Poppins', sans-serif;
        }


        body{

            overflow:hidden;

            color:white;

            background:black;
        }


        /* VIDEO BACKGROUND */

        .video-container{

            position:fixed;

            top:0;
            left:0;

            width:100%;

            height:100%;

            overflow:hidden;

            z-index:-5;
        }


        .video-bg{

            position:absolute;

            width:100%;

            height:100%;

            object-fit:cover;

            opacity:0;

            transition:opacity 2s ease-in-out;
        }


        .video-bg.active{

            opacity:1;
        }


        /* MAIN OVERLAY */

        .overlay{

            position:fixed;

            top:0;
            left:0;

            width:100%;

            height:100%;

            background:
            linear-gradient(
                135deg,
                rgba(255,107,0,0.28),
                rgba(0,191,255,0.18),
                rgba(15,23,42,0.45)
            );

            z-index:-4;
        }


        /* EXTRA GLOW */

        .glow{

            position:fixed;

            width:600px;

            height:600px;

            background:
            radial-gradient(
                circle,
                rgba(255,107,0,0.25),
                transparent 70%
            );

            top:-150px;

            right:-100px;

            filter:blur(50px);

            z-index:-3;
        }


        /* NAVBAR */

        nav{

            position:fixed;

            top:0;

            width:100%;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:22px 7%;

            z-index:1000;

            backdrop-filter:blur(10px);

            background:rgba(255,255,255,0.04);

            border-bottom:
            1px solid rgba(255,255,255,0.12);
        }


        /* LEFT SIDE */

        .left-side{

            display:flex;

            align-items:center;

            gap:18px;
        }


        .logo{

            font-size:50px;

            font-weight:800;

            color:white;

            text-shadow:
            0 0 25px rgba(255,255,255,0.4);
        }


        /* PROFILE IMAGE */

        .profile-circle{

            width:72px;

            height:72px;

            border-radius:50%;

            overflow:hidden;

            border:3px solid rgba(255,255,255,0.8);

            background:white;

            box-shadow:
            0 0 30px rgba(255,255,255,0.35);
        }


        .profile-circle img{

            width:100%;

            height:100%;

            object-fit:cover;
        }


        /* NAV BUTTONS */

        .nav-buttons{

            display:flex;

            gap:16px;

            flex-wrap:wrap;
        }


        .nav-buttons a{

            text-decoration:none;
        }


        .btn{

            padding:14px 28px;

            border:none;

            border-radius:50px;

            background:rgba(255,255,255,0.9);

            color:var(--orange);

            font-size:15px;

            font-weight:600;

            cursor:pointer;

            transition:0.45s ease;

            box-shadow:
            0 8px 30px rgba(0,0,0,0.25);
        }


        .btn:hover{

            background:var(--skyblue);

            color:white;

            transform:
            rotate(6deg)
            scale(1.08);

            box-shadow:
            0 0 30px rgba(0,191,255,0.7);
        }


        /* HERO SECTION */

        .hero{

            width:100%;

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

            text-align:center;
        }


        /* GLASS BOX */

        .hero-content{

            width:100%;

            max-width:900px;

            padding:60px 50px;

            border-radius:30px;

            background:
            rgba(0,191,255,0.14);

            border:
            1px solid rgba(255,255,255,0.22);

            backdrop-filter:blur(18px);

            box-shadow:
            0 15px 50px rgba(0,0,0,0.35);

            animation:
            floatBox 4s ease-in-out infinite,
            fadeUp 1.5s ease;
        }


        /* FLOATING EFFECT */

        @keyframes floatBox{

            0%{

                transform:translateY(0px);
            }

            50%{

                transform:translateY(-14px);
            }

            100%{

                transform:translateY(0px);
            }
        }


        /* ENTRY ANIMATION */

        @keyframes fadeUp{

            from{

                opacity:0;

                transform:translateY(80px);
            }

            to{

                opacity:1;

                transform:translateY(0);
            }
        }


        .hero h1{

            font-size:88px;

            line-height:1.1;

            margin-bottom:25px;

            font-weight:800;

            text-shadow:
            0 8px 30px rgba(0,0,0,0.5);
        }


        .hero p{

            font-size:25px;

            line-height:1.9;

            color:rgba(255,255,255,0.95);

            text-shadow:
            0 4px 15px rgba(0,0,0,0.45);
        }


        /* RESPONSIVE */

        @media(max-width:950px){

            nav{

                flex-direction:column;

                gap:20px;
            }

            .hero h1{

                font-size:55px;
            }

            .hero p{

                font-size:19px;
            }

            .hero-content{

                padding:45px 30px;
            }

        }


        @media(max-width:600px){

            .hero h1{

                font-size:38px;
            }

            .hero p{

                font-size:16px;
            }

            .btn{

                padding:12px 18px;

                font-size:13px;
            }

        }

    </style>

</head>

<body>



    <!-- VIDEO BACKGROUNDS -->

    <div class="video-container">

        <video class="video-bg active" autoplay muted loop playsinline>

            <source src="wall1.mp4" type="video/mp4">

        </video>


        <video class="video-bg" autoplay muted loop playsinline>

            <source src="wall2.mp4" type="video/mp4">

        </video>


        <video class="video-bg" autoplay muted loop playsinline>

            <source src="wall3.mp4" type="video/mp4">

        </video>


        <video class="video-bg" autoplay muted loop playsinline>

            <source src="wall9.mp4" type="video/mp4">

        </video>

    </div>



    <!-- OVERLAYS -->

    <div class="overlay"></div>

    <div class="glow"></div>



    <!-- NAVBAR -->

    <nav>

        <div class="left-side">

            <div class="logo">

                M

            </div>


            <!-- PROFILE IMAGE -->

            <div class="profile-circle">

                <img src="jeed.jpg" alt="Majid Mohamed">

            </div>

        </div>



        <div class="nav-buttons">

            <a href="projects.html">

                <button class="btn">

                    Projects

                </button>

            </a>



            <a href="skills.html">

                <button class="btn">

                    Skills

                </button>

            </a>



            <a href="personal.html">

                <button class="btn">

                    Personal

                </button>

            </a>



            <a href="contacts.html">

                <button class="btn">

                    Contacts

                </button>

            </a>

        </div>

    </nav>



    <!-- HERO SECTION -->

    <section class="hero">

        <div class="hero-content">

            <h1>

                Welcome To
                My Portfolio

            </h1>


            <p>

                MAJID MOHAMED |
                Data Science Student |
                Machine Learning Enthusiast

            </p>

        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script>

        const videos =
        document.querySelectorAll('.video-bg');

        let currentVideo = 0;


        function rotateVideos(){

            videos[currentVideo]
            .classList.remove('active');

            currentVideo =
            (currentVideo + 1)
            % videos.length;

            videos[currentVideo]
            .classList.add('active');
        }


        setInterval(
            rotateVideos,
            8000
        );

    </script>

</body>

</html>
